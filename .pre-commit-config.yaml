# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
# yamlfmt for GitHub Actions workflow files ONLY
- repo: local
  hooks:
  - id: yamlfmt
    name: Format GitHub Actions workflow files with yamlfmt
    entry: yamlfmt
    language: golang
    types: [yaml]
    files: '^\.github/workflows/.*\.(yml|yaml)$'
    additional_dependencies:
      ["github.com/google/yamlfmt/cmd/yamlfmt@latest"]

  # GitHub Actions linting
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
  - id: actionlint
    name: Lint GitHub Actions workflow files
    entry: actionlint
    language: system
    types: [yaml]
    files: '^\.github/workflows/.*\.(yml|yaml)$'

  # uv for dependency management
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.7.13
  hooks:
  # Ensure uv.lock is up-to-date
  - id: uv-lock
    name: Check uv.lock is up-to-date
    args: [--locked]

  # Export requirements.txt from uv.lock for compatibility
  - id: uv-export
    name: Export requirements.txt from uv.lock
    args: [--frozen, --no-hashes, -o, requirements.txt]
    files: ^(uv\.lock|pyproject\.toml)$

  # Export dev requirements
  - id: uv-export
    name: Export dev requirements from uv.lock
    args: [--frozen, --no-hashes, --all-extras, -o, requirements-dev.txt]
    files: ^(uv\.lock|pyproject\.toml)$

  # Python code quality checks
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.12.0
  hooks:
  # Run ruff linter with exact CI ignore rules
  - id: ruff
    name: Run ruff linter
    args:
      [
        --ignore,
        "E203,E402,E501,E266,W505,F841,F842,F401,W293,I001,UP015,C901,W291",
        --isolated,
        --fix,
        --exit-non-zero-on-fix,
        --output-format,
        full,
      ]
  # Run ruff formatter
  - id: ruff-format
    name: Run ruff formatter
    args: [--line-length=320, --isolated]

  # Black formatter for Python
- repo: https://github.com/psf/black
  rev: 24.8.0
  hooks:
  - id: black
    name: Format Python with Black
    language_version: python3
    args: [--line-length=320]

  # Gitleaks for secret detection
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.27.2
  hooks:
  - id: gitleaks
    name: Detect secrets with gitleaks

  # Python linting with mypy
- repo: local
  hooks:
  - id: mypy
    name: Type check with mypy
    entry: uv run mypy
    language: system
    types: [python]
    require_serial: true
    args: [--strict, --ignore-missing-imports]
    exclude: ^(tests/|test_|.*_test\.py|.*_test_\.py|sample_projects/)

  # Python tests
- repo: local
  hooks:
  - id: pytest-quick
    name: Run quick Python tests
    entry: uv run pytest
    language: system
    pass_filenames: false
    stages: [pre-commit]
    args:
      [
        -v,
        --tb=short,
        --timeout=60,
        -m,
        "not slow",
        --cov,
        --cov-report=xml,
        --maxfail=5,
        tests/,
        PYTHON/tests/,
        cli/,
      ]
    files: \.py$

  # JavaScript/TypeScript linting
- repo: local
  hooks:
  - id: eslint
    name: ESLint JavaScript/TypeScript
    entry: pnpm run lint
    language: system
    types_or: [javascript, jsx, ts, tsx]
    pass_filenames: false

  # JavaScript/TypeScript formatting
- repo: local
  hooks:
  - id: prettier
    name: Format JavaScript/TypeScript with Prettier
    entry: pnpm run format
    language: system
    types_or: [javascript, jsx, ts, tsx, json, css, scss]
    pass_filenames: false

  # Shell script linting
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
  - id: shellcheck
    name: Lint shell scripts
    args: [--severity=error]

  # YAML linting
- repo: https://github.com/adrienverge/yamllint
  rev: v1.33.0
  hooks:
  - id: yamllint
    name: Lint YAML files
    args: [-c=.yamllint]

  # deptry for dependency analysis
- repo: local
  hooks:
  - id: deptry
    name: Check Python dependencies with deptry
    entry: uv run deptry
    language: system
    always_run: true
    pass_filenames: false
    args:
    - .
    - --extend-exclude
    - "tests"
    - --extend-exclude
    - ".*_test.*\\.py"
    - --extend-exclude
    - "node_modules"
    - --extend-exclude
    - "playwright-test"
    - --extend-exclude
    - "examples"
    - --extend-exclude
    - "public"
    - --extend-exclude
    - "out"
    - --extend-exclude
    - "dist"
    - --extend-exclude
    - "PYTHON/tests"
    - --known-first-party
    - atlasvibe
    - --known-first-party
    - atlasvibe_sdk
    - --known-first-party
    - atlasvibe_engine
    - --known-first-party
    - atlasvibe_cli
    - --known-first-party
    - captain
    - --known-first-party
    - cli
    - --ignore
    - DEP003
    - --per-rule-ignores
    - "DEP002=scipy|scikit-image|Pillow|httpx|python-dotenv|debugpy|chardet|griffe|striprtf|isbinary|python-multipart|pathspec|pytest-cov|pytest-mock|pytest-asyncio|ruff|deptry|pytest-json-report|robotframework|opencv-python,DEP001=transformers|torch|tensorflow|cv2|skimage|PIL|sklearn|mecademicpy|astor|huggingsound|qcodes|tm_devices|portalocker|huggingface_hub|scipy|scikit-learn|keras|jax|flax|onnx|onnxruntime|deeplabcut|ultralytics|speechbrain|lavis|segment_anything|easyocr|keybert|pygments|readability|readability-lxml|matplotlib|bs4|trafilatura|sre_yield|torchvision|prophet|IPython|sympy|hatchling|nidaqmx|nimodinst|pyvisa|serial|keyrings|keyring"

  # General file checks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    name: Trim trailing whitespace
  - id: end-of-file-fixer
    name: Fix end of files
  - id: check-yaml
    name: Check YAML syntax
    exclude: '^\.github/workflows/.*\.(yml|yaml)$'  # Actionlint handles these
  - id: check-added-large-files
    name: Check for large files
    args: ["--maxkb=5000"]
  - id: check-merge-conflict
    name: Check for merge conflicts
  - id: check-json
    name: Check JSON syntax
  - id: check-toml
    name: Check TOML syntax
  - id: detect-private-key
    name: Detect private keys

  # TypeScript type checking
- repo: local
  hooks:
  - id: typescript-check
    name: TypeScript type check
    entry: pnpm exec tsc --noEmit
    language: system
    types_or: [ts, tsx]
    pass_filenames: false

  # UV pip dependency check
- repo: local
  hooks:
  - id: uv-pip-check
    name: Check Python dependencies consistency
    entry: uv pip check
    language: system
    pass_filenames: false
    always_run: true

  # Block sync check
- repo: local
  hooks:
  - id: block-sync-check
    name: Check block metadata is synced
    entry: ./scripts/check-block-sync.sh
    language: system
    pass_filenames: false
    files: ^blocks/.*\.py$

  # Block-specific tests
- repo: local
  hooks:
  - id: block-tests
    name: Run block tests
    entry: uv run pytest
    language: system
    pass_filenames: false
    args: [-vv, -m, "not slow", --tb=short, blocks/]
    files: ^blocks/.*\.py$

# Configuration for specific hooks
exclude: |
  (?x)^(
    \.git/|
    \.venv/|
    venv/|
    build/|
    dist/|
    node_modules/|
    out/|
    \.pytest_cache/|
    \.mypy_cache/|
    htmlcov/|
    \.tox/|
    \.coverage
  )$
