name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  DISPLAY: :0
  UV_VERSION: "0.7.13"
  PRE_COMMIT_MAX_WORKERS: 1
  CI_SEQUENTIAL_MODE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-code-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python from uv
      run: uv python install

    - name: Check format with Ruff
      run: uvx ruff format --check --line-length=320 --isolated .

  python-code-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python from uv
      run: uv python install

    - name: Lint with Ruff
      run: uvx ruff check --ignore E203,E402,E501,E266,W505,F841,F842,F401,W293,I001,UP015,C901,W291 --isolated --fix --output-format full .

  ts-code-style:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - uses: pnpm/action-setup@v4
      name: Install pnpm
      with:
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - uses: actions/cache@v4
      name: Cache pnpm
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install Node Dependencies
      run: pnpm install

    - name: Eslint check
      run: pnpm lint

    - name: Typescript check
      run: pnpm exec tsc --noEmit

    - name: Black Prettier check
      run: pnpm run check

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python from uv
      run: uv python install

    - name: Install Python Dependencies
      run: uv sync --locked --all-extras --dev

    - name: pytest
      timeout-minutes: 10
      run: |
        uv run python -m pytest -v --tb=short --timeout=60 -m "not slow" --cov --cov-report=xml tests/ PYTHON/tests/ cli/

    - name: Codecov report
      uses: codecov/codecov-action@v4
      with:
        flags: python

  check-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Check if lockfile is up to date
      run: |
        uv lock --check

    - name: Verify dependencies
      run: |-
        uv pip check || true

  docker-headless-tests:
    name: Docker Headless Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker test image
      run: |
        echo "🔧 Building Docker test image..."
        docker build -f Dockerfile.test -t atlasvibe-test-ci .

    - name: Run headless tests in Docker
      run: |
        echo "🧪 Running headless tests in Docker..."
        # Ensure no display variable is set
        unset DISPLAY

        # Create directories for test results
        mkdir -p test-results playwright-report

        # Run the container with identical settings as local
        docker run \
          --rm \
          -e DISPLAY=:99 \
          -e CI=true \
          -e NODE_ENV=test \
          -e ELECTRON_DISABLE_GPU=1 \
          -e ELECTRON_NO_SANDBOX=1 \
          -e XVFB_SCREEN_SIZE=1280x1024x24 \
          -v ${{ github.workspace }}/test-results:/app/test-results \
          -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
          atlasvibe-test-ci

    - name: Upload test artifacts
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 7
