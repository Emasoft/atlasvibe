name: Docker Headless Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-headless-test:
    name: Run Headless Tests in Docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: network=host

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build test Docker image
      run: |
        echo "🔧 Building Docker test image..."
        docker build -f Dockerfile.test -t atlasvibe-test-ci --cache-from type=local,src=/tmp/.buildx-cache --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max .

    - name: Move cache
      run: |
        rm -rf /tmp/.buildx-cache
        mv /tmp/.buildx-cache-new /tmp/.buildx-cache

    - name: Run headless tests in Docker
      run: |
        echo "🧪 Running headless tests in Docker..."
        # Ensure no display variable is set
        unset DISPLAY

        # Run the container with identical settings as local
        docker run \
          --rm \
          -e DISPLAY=:99 \
          -e CI=true \
          -e NODE_ENV=test \
          -e ELECTRON_DISABLE_GPU=1 \
          -e ELECTRON_NO_SANDBOX=1 \
          -e XVFB_SCREEN_SIZE=1280x1024x24 \
          -v ${{ github.workspace }}/test-results:/app/test-results \
          -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
          atlasvibe-test-ci

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test-results/
          playwright-report/
        retention-days: 7

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

    - name: Display test summary
      if: always()
      run: |
        echo "📊 Test Results Summary"
        echo "======================"
        if [ -f test-results/results.json ]; then
          # Create and run Python script to parse results
          echo 'import json
        import sys

        try:
            with open("test-results/results.json", "r") as f:
                data = json.load(f)

            # Count results
            total = 0
            passed = 0
            failed = 0
            skipped = 0

            if "suites" in data:
                for suite in data["suites"]:
                    for spec in suite.get("specs", []):
                        for test in spec.get("tests", []):
                            total += 1
                            results = test.get("results", [])
                            if results:
                                status = results[0].get("status", "passed").lower()
                                if status == "passed":
                                    passed += 1
                                elif status == "failed":
                                    failed += 1
                                elif status == "skipped":
                                    skipped += 1

            print(f"Total Tests: {total}")
            print(f"✅ Passed: {passed}")
            print(f"❌ Failed: {failed}")
            print(f"⏭️  Skipped: {skipped}")

            if failed > 0:
                print(f"\n😞 {failed} tests failed!")
                sys.exit(1)
            else:
                print(f"\n🎉 All tests passed!")

        except Exception as e:
            print(f"Error parsing results: {e}")
            sys.exit(1)' | python3
        else
          echo "❌ No test results file found"
          exit 1
        fi

    - name: Comment PR with results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |-
          const fs = require('fs');

          let comment = '## 🐳 Docker Headless Test Results\n\n';

          try {
            if (fs.existsSync('test-results/results.json')) {
              const data = JSON.parse(fs.readFileSync('test-results/results.json', 'utf8'));

              let total = 0, passed = 0, failed = 0, skipped = 0;

              if (data.suites) {
                for (const suite of data.suites) {
                  for (const spec of suite.specs || []) {
                    for (const test of spec.tests || []) {
                      total++;
                      const results = test.results || [];
                      if (results.length > 0) {
                        const status = results[0].status?.toLowerCase() || 'passed';
                        if (status === 'passed') passed++;
                        else if (status === 'failed') failed++;
                        else if (status === 'skipped') skipped++;
                      }
                    }
                  }
                }
              }

              comment += `- Total Tests: ${total}\n`;
              comment += `- ✅ Passed: ${passed}\n`;
              comment += `- ❌ Failed: ${failed}\n`;
              comment += `- ⏭️ Skipped: ${skipped}\n\n`;

              if (failed > 0) {
                comment += '### ❌ Some tests failed. Check the artifacts for details.\n';
              } else {
                comment += '### ✅ All tests passed!\n';
              }
            } else {
              comment += '❌ No test results found.\n';
            }
          } catch (error) {
            comment += `❌ Error parsing results: ${error.message}\n`;
          }

          comment += '\n[View full report in artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
