name: Block Quality Check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

env:
  PRE_COMMIT_MAX_WORKERS: 1
  CI_SEQUENTIAL_MODE: 1

jobs:
  block-completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - uses: actions/setup-python@v5
      name: Setup Python 3.11
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: uv sync --locked --all-extras --dev

    - name: Check if there is any missing Block component
      run: uv run python -m cli.cmd.sync

    - name: Check if everything is in sync
      run: |
        if git add . && git diff --quiet && git diff --cached --quiet; then
          echo "No changes found, we are good to go!"
        else
          echo "Error: Changes detected. Please make sure to run the sync command and commit the changes"
          git status --porcelain
          exit 1
        fi

  block-code-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python from uv
      run: uv python install

    - name: Check format with Ruff
      run: uvx ruff format --check --line-length=320 --isolated .

  block-code-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install Python from uv
      run: uv python install

    - name: Lint with Ruff
      run: uvx ruff check --ignore E203,E402,E501,E266,W505,F841,F842,F401,W293,I001,UP015,C901,W291 --isolated --fix --output-format full .

  pytest:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4
      name: Checkout repository

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - uses: actions/setup-python@v5
      name: Setup Python 3.11
      with:
        python-version: "3.11"

    - name: Install dependencies for pytest
      run: uv sync --locked --all-extras --dev

    - name: Run pytest
      env:
        PYTHONPATH: ${{ github.workspace }}
      run: uv run python -m pytest -vv -m "not slow" --tb=short blocks/
