name: Automated Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_profile:
        description: 'Test profile to run'
        required: false
        default: 'auto'
        type: choice
        options:
        - auto
        - quick
        - full
        - ui-only


env:
  UV_VERSION: "0.7.13"
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  detect-tests:
    name: Detect Tests to Run
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.detect.outputs.matrix }}
      run-python: ${{ steps.detect.outputs.python }}
      run-js: ${{ steps.detect.outputs.js }}
      run-docker: ${{ steps.detect.outputs.docker }}
      run-ui: ${{ steps.detect.outputs.ui }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2 # Need history for change detection

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Detect required tests
      id: detect
      run: |
        python detect-tests.py --json > test-plan.json

        # Parse test plan
        {
          echo "python=$(jq -r 'any(.test_commands[]; .[0] | contains("Python"))' test-plan.json)"
          echo "js=$(jq -r 'any(.test_commands[]; .[0] | contains("JavaScript"))' test-plan.json)"
          echo "docker=$(jq -r 'any(.test_commands[]; .[0] | contains("Docker"))' test-plan.json)"
          echo "ui=$(jq -r 'any(.test_commands[]; .[0] | contains("UI"))' test-plan.json)"

          # Create matrix for parallel execution
          echo "matrix=$(jq -c '.test_commands | map({name: .[0], cmd: .[1]})' test-plan.json)"
        } >> "$GITHUB_OUTPUT"

  python-tests:
    name: Python Tests
    needs: detect-tests
    if: needs.detect-tests.outputs.run-python == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Load test configuration
      run: |
        if [ -f test-config/remote.env ]; then
          export "$(grep -v '^#' test-config/remote.env | xargs)"
        fi
      shell: bash

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Run Python tests
      run: |
        uv run pytest -v -m "not slow" \
          --tb=short \
          --maxfail=5 \
          --junit-xml=test-results-${{ matrix.os }}.xml \
          .

    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: python-test-results-${{ matrix.os }}
        path: test-results-*.xml

  javascript-tests:
    name: JavaScript/TypeScript Tests
    needs: detect-tests
    if: needs.detect-tests.outputs.run-js == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - uses: pnpm/action-setup@v4
      with:
        version: 9
        run_install: false

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - uses: actions/cache@v4
      name: Setup pnpm cache
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install

    - name: Run linting
      run: pnpm run lint

    - name: Run tests
      run: pnpm test

    - name: Check formatting
      run: pnpm run format:check

  docker-tests:
    name: Docker Container Tests
    needs: detect-tests
    if: needs.detect-tests.outputs.run-docker == 'true' || github.event.inputs.test_profile == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [remote, integration]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Load test configuration
      run: |
        if [ -f test-config/remote.env ]; then
          export "$(grep -v '^#' test-config/remote.env | xargs)"
        fi

    - name: Build Docker test image
      run: |
        docker compose -f docker/docker-compose.test.yml build \
          --build-arg BUILDKIT_INLINE_CACHE=1

    - name: Run Docker tests - ${{ matrix.profile }}
      run: |
        ./test-docker-comprehensive.sh ${{ matrix.profile }} --skip-build

    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-test-results-${{ matrix.profile }}
        path: test-results/

  ui-tests:
    name: UI Tests
    needs: detect-tests
    if: needs.detect-tests.outputs.run-ui == 'true' || github.event.inputs.test_profile == 'ui-only'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libgtk-3-0 \
          libgbm1 \
          libnss3 \
          libasound2t64 \
          libx11-xcb1 \
          libxss1 || \
        sudo apt-get install -y \
          xvfb \
          libgtk-3-0 \
          libgbm1 \
          libnss3 \
          libasound2 \
          libx11-xcb1 \
          libxss1

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: ${{ env.UV_VERSION }}

    - name: Install dependencies
      run: |
        pnpm install
        uv sync --locked --all-extras --dev
        pnpm exec playwright install chromium

    - name: Build application
      run: |
        pnpm run build
        pnpm run electron-package:linux

    - name: Run UI tests
      run: |
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
          pnpm exec playwright test playwright-test/ui-docker-tests.spec.ts \
          --reporter=html

    - name: Upload UI test results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-results
        path: |
          playwright-report/
          test-results/

  test-summary:
    name: Test Summary
    needs: [python-tests, javascript-tests, docker-tests, ui-tests]
    if: success() || failure()
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: all-results

    - name: Generate test summary
      run: |
        {
          echo "# Test Results Summary"
          echo ""

          # Check each job result
          if [ "${{ needs.python-tests.result }}" == "success" ]; then
            echo "✅ Python Tests: Passed"
          else
            echo "❌ Python Tests: ${{ needs.python-tests.result }}"
          fi

          if [ "${{ needs.javascript-tests.result }}" == "success" ]; then
            echo "✅ JavaScript Tests: Passed"
          else
            echo "❌ JavaScript Tests: ${{ needs.javascript-tests.result }}"
          fi

          if [ "${{ needs.docker-tests.result }}" == "success" ]; then
            echo "✅ Docker Tests: Passed"
          else
            echo "❌ Docker Tests: ${{ needs.docker-tests.result }}"
          fi

          if [ "${{ needs.ui-tests.result }}" == "success" ]; then
            echo "✅ UI Tests: Passed"
          else
            echo "❌ UI Tests: ${{ needs.ui-tests.result }}"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |-
          const summary = `## Test Results

          | Test Suite | Status |
          |------------|--------|
          | Python | ${{ needs.python-tests.result }} |
          | JavaScript | ${{ needs.javascript-tests.result }} |
          | Docker | ${{ needs.docker-tests.result }} |
          | UI | ${{ needs.ui-tests.result }} |

          View detailed results in the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });
