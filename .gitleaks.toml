# Gitleaks configuration for AtlasVibe
# This configuration allows only specific known values and blocks all other secrets
# Updated: December 2024

title = "AtlasVibe Gitleaks Configuration"

# Extend the base configuration
[extend]
useDefault = true

# Global allowlist - these exact values are permitted
[allowlist]
description = "Global allowlist for AtlasVibe"
paths = [
    '''\.gitleaks\.toml$''',
    '''(^|/)\.git/''',
    '''(^|/)node_modules/''',
    '''(^|/)\.venv/''',
    '''(^|/)venv/''',
    '''(^|/)out/''',
    '''(^|/)dist/''',
    '''(^|/)build/''',
    '''(^|/)__pycache__/''',
    '''\.pyc$''',
    # Exclude test files and documentation from some checks
    '''PYTHON/WATCH/''',  # External dependencies
]

# Allow specific patterns
regexes = [
    # Git configuration values that are EXPLICITLY ALLOWED
    '''Emasoft''',
    '''713559\+Emasoft@users\.noreply\.github\.com''',

    # GitHub noreply email pattern (safe)
    '''[0-9]+\+[a-zA-Z0-9_-]+@users\.noreply\.github\.com''',

    # GitHub Actions secrets syntax (safe - they're references, not actual secrets)
    '''\$\{\{\s*secrets\.[A-Z_]+\s*\}\}''',
    '''\$\{\{[^}]+\}\}''',  # Any GitHub Actions expression

    # Common test/example values
    '''(test|example|demo|sample|placeholder|dummy)[-_]?(api)?[-_]?(key|token|secret|password)''',
    '''YOUR[-_]?API[-_]?KEY[-_]?HERE''',
    '''<your[-_]?(api[-_]?)?key>''',
    '''REPLACE[-_]?WITH[-_]?YOUR[-_]?(KEY|TOKEN|SECRET)''',
    '''xxx+''',
    '''abc123''',
    '''placeholder''',
    '''your-key-here''',

    # AtlasVibe specific patterns
    '''atlasvibe''',
    '''ATLASVIBE''',
    '''localhost''',
    '''127\.0\.0\.1''',
    '''0\.0\.0\.0''',

    # Git author environment variables
    '''GIT_AUTHOR(_NAME|_EMAIL)?=.*''',
    '''GIT_COMMITTER(_NAME|_EMAIL)?=.*''',
]

# Commits to allowlist (by exact match)
commits = [
    '''713559\+Emasoft@users\.noreply\.github\.com''',
]

# Enhanced custom rules for maximum security
[[rules]]
id = "api-key-generic"
description = "Generic API Key"
regex = '''(?i)(api[_\-\s]?key|apikey|api[_\-\s]?secret|apisecret)[_\-\s]?[=:][_\-\s]?['\"]?[a-zA-Z0-9\-_]{20,}['\"]?'''
tags = ["api", "key", "secret"]
entropy = 3.5
secretGroup = 1

[[rules]]
id = "private-key-block"
description = "Private Key Block"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----'''
tags = ["private", "key"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9]{22}_[a-zA-Z0-9]{59}|ghs_[a-zA-Z0-9]{36}'''
tags = ["github", "token"]

[[rules]]
id = "aws-access-key"
description = "AWS Access Key ID"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["aws", "key"]

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Access Key"
regex = '''(?i)aws[_\-\s]?secret[_\-\s]?access[_\-\s]?key[_\-\s]?[=:][_\-\s]?[a-zA-Z0-9/+=]{40}'''
tags = ["aws", "secret"]

[[rules]]
id = "generic-secret"
description = "Generic Secret"
regex = '''(?i)(secret|password|passwd|pwd|token|auth)[_\-\s]?[=:][_\-\s]?['\"]?[a-zA-Z0-9\-_!@#$%^&*()+=]{8,}['\"]?'''
tags = ["secret", "password"]
entropy = 3.0
[rules.allowlist]
regexes = [
    '''(test|example|demo|sample|placeholder|dummy|your)''',
    '''Emasoft''',
    '''713559\+Emasoft@users\.noreply\.github\.com''',
]

[[rules]]
id = "env-var-leak"
description = "Environment Variable with Secret"
regex = '''(?i)export\s+[A-Z_]*(KEY|TOKEN|SECRET|PASSWORD)[A-Z_]*\s*=\s*['\"]?[^\s'"]+['\"]?'''
tags = ["env", "secret"]
[rules.allowlist]
regexes = [
    '''(test|example|demo|sample|placeholder)''',
]

# Separate rule for git author variables (always allowed)
[[rules]]
id = "git-author-env"
description = "Git Author Environment Variables"
regex = '''export\s+GIT_(AUTHOR|COMMITTER)(_NAME|_EMAIL)?\s*=\s*['\"]?[^\s'"]+['\"]?'''
tags = ["git", "env"]
[rules.allowlist]
regexes = [
    '''.*''',  # All git author/committer variables are allowed
]

[[rules]]
id = "git-config-validation"
description = "Git Configuration Validation"
regex = '''git\s+config\s+(--local\s+|--global\s+)?user\.(name|email)\s+['\"]?([^'\"]+)['\"]?'''
secretGroup = 3
tags = ["git", "config"]
[rules.allowlist]
regexes = [
    '''Emasoft''',
    '''713559\+Emasoft@users\.noreply\.github\.com''',
]
paths = [
    '''setup-git-env\.sh$''',  # This is the setup script itself
]

# Specific file type checks
[[rules]]
id = "json-secrets"
description = "Secrets in JSON files"
path = '''\.json$'''
regex = '''['\"]?(api[_\-]?key|secret|token|password|auth)['\"]?\s*:\s*['\"]([^'\"]+)['\"]'''
secretGroup = 2
[rules.allowlist]
regexes = [
    '''(test|example|demo|null|\$\{.*\}|<.*>)''',
]

[[rules]]
id = "yaml-secrets"
description = "Secrets in YAML files"
path = '''\.ya?ml$'''
regex = '''(api[_\-]?key|secret|token|password|auth):\s*['"]?([^'"\s]+)['"]?'''
secretGroup = 2
[rules.allowlist]
regexes = [
    '''(test|example|demo|null|\$\{.*\}|<.*>)''',
    '''\$\{\{[^}]+\}\}''',  # GitHub Actions expressions
]

# Database connection strings
[[rules]]
id = "connection-string"
description = "Database Connection String with Credentials"
regex = '''(?i)(postgres|postgresql|mysql|mariadb|mongodb|redis|amqp|jdbc)://[^:]+:[^@]+@[^/\s]+'''
tags = ["database", "password"]
[rules.allowlist]
regexes = [
    '''(test|example|localhost|127\.0\.0\.1|db|database|user:pass@host)''',
]
paths = [
    '''.*_test\.py$''',  # Allow in test files
    '''.*\.c$''',  # Allow in C source files (documentation)
    '''.*\.md$''',  # Allow in markdown files
]

# Slack/Discord webhooks
[[rules]]
id = "slack-webhook"
description = "Slack Webhook URL"
regex = '''https://hooks\.slack\.com/services/[A-Z0-9]+/[A-Z0-9]+/[a-zA-Z0-9]+'''
tags = ["slack", "webhook"]

[[rules]]
id = "discord-webhook"
description = "Discord Webhook URL"
regex = '''https://discord(app)?\.com/api/webhooks/[0-9]+/[a-zA-Z0-9_-]+'''
tags = ["discord", "webhook"]

# PyPI token
[[rules]]
id = "pypi-token"
description = "PyPI API Token"
regex = '''pypi-[a-zA-Z0-9_-]{40,}'''
tags = ["pypi", "token"]

# NPM token
[[rules]]
id = "npm-token"
description = "NPM Access Token"
regex = '''npm_[a-zA-Z0-9]{36}'''
tags = ["npm", "token"]
