[pytest]
# Configuration for running all tests without skipping

# Use pytest-forcerun plugin if available
addopts = -rsxX -l --tb=short --strict-markers --runxfail

# Alternative: Override skipif conditions with markers
markers =
    slow: marks tests as slow
    skip: marks tests to skip (override with --runxfail)
    xfail: marks tests as expected to fail

# Run all tests including slow ones
python_files = test_*.py *_test_.py
testpaths = 
    tests
    PYTHON/tests
    blocks
    atlasvibe_engine/tests
    cli
    playwright-test/fixtures/custom-sequences

# Don't skip slow tests
norecursedirs = .git .tox dist build *.egg