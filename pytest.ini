[pytest]
# Test discovery patterns
python_files = *_test_.py *_test.py test_*.py
python_classes = Test*
python_functions = test_*

# Add current directory to Python path for imports
pythonpath = .

# Test paths
testpaths = tests captain/tests blocks pkgs/atlasvibe/tests

# Exclude directories
norecursedirs = .git .venv node_modules dist out release sample_projects

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests

# Test output configuration
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Timeout for tests (in seconds)
timeout = 300

# Minimum Python version
minversion = 3.8

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */test_*
    */_test_*
    */conftest.py
    */setup.py
    */venv/*
    */.venv/*
    */node_modules/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
    if __name__ == .__main__.:
