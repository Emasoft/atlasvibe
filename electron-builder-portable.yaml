directories:
  output: dist-portable
appId: com.emasoft.atlasvibe.portable
productName: AtlasVibe Portable
icon: ./public/favicon.ico
asar: false
compression: store

files:
  - out/**/*

extraResources:
  - from: "public"
    to: "public"
  - from: "captain"
    to: "captain"
  - from: "pkgs"
    to: "pkgs"
  - from: "PYTHON"
    to: "PYTHON"
  - from: "main.py"
    to: "main.py"
  - from: "pyproject.toml"
    to: "pyproject.toml"
  - from: "blocks"
    to: "blocks"
  - from: "examples"
    to: "examples"
  - from: "sample_projects"
    to: "sample_projects"
  - from: "start-atlasvibe.bat"
    to: "../"
  - from: "start-atlasvibe.sh"
    to: "../"

win:
  icon: ./public/favicon.ico
  target:
    - target: portable
      arch:
        - x64
  # No signing for portable version
  verifyUpdateCodeSignature: false
  publisherName: Emasoft

portable:
  # Portable-specific settings
  artifactName: "AtlasVibe-Portable-${version}-${arch}.${ext}"
  unpackDirName: "AtlasVibe-Portable"
  # Don't request elevation
  requestExecutionLevel: user
  # Use local app data
  useLocalAppData: true

extraMetadata:
  main: out/main/index.js
extends: null
