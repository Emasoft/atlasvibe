version: "3.8"

services:
  atlasvibe:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "5173:5173"
      - "11060:11060"
    environment:
      - NODE_ENV=production
      - DISPLAY=:99
      - UV_SYSTEM_PYTHON=true
    volumes:
      - ./sample_projects:/app/sample_projects
      - atlasvibe_data:/app/data
      - uv-cache:/root/.cache/uv
    networks:
      - atlasvibe_network

  atlasvibe-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    environment:
      - NODE_ENV=test
      - CI=true
      - DISPLAY=:99
      # Ensure Electron runs headless
      - ELECTRON_DISABLE_GPU=1
      - ELECTRON_NO_SANDBOX=1
      - ELECTRON_ENABLE_LOGGING=1
      - UV_SYSTEM_PYTHON=true
      - XVFB_SCREEN_SIZE=1280x1024x24
    volumes:
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
      - uv-cache:/root/.cache/uv
    # Prevent any connection to host display
    init: true
    security_opt:
      - no-new-privileges:true
    # Disable IPC namespace to prevent X11 socket access
    ipc: none
    # Entrypoint is already set in Dockerfile, no need for command
    # command is handled by ENTRYPOINT in Dockerfile
    networks:
      - atlasvibe_network

volumes:
  atlasvibe_data:
  uv-cache:

networks:
  atlasvibe_network:
    driver: bridge
